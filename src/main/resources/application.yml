server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: relayhub-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/relayhub}
    username: ${SPRING_DATASOURCE_USERNAME:relayhub}
    password: ${SPRING_DATASOURCE_PASSWORD:relayhub_secret}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 1800000
  flyway:
    baseline-on-migrate: ${RELAYHUB_BASELINE_EXISTING:false}
    baseline-version: 0
    validate-on-migrate: true
  sql:
    init:
      mode: always
      schema-locations: classpath:empty.sql
      data-locations: ${RELAYHUB_SEED_LOCATION:classpath:empty.sql}
      continue-on-error: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:relayhub-dispatcher-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

relayhub:
  webhook:
    allowed-hosts: ${RELAYHUB_WEBHOOK_ALLOWED_HOSTS:}
    allow-private-targets: ${RELAYHUB_WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
  workers:
    enabled: ${RELAYHUB_WORKERS_ENABLED:true}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      events: ${KAFKA_TOPIC_EVENTS:relayhub.events}
      dlq: ${KAFKA_TOPIC_DLQ:relayhub.events.dlq}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        relayhub.webhook.delivery.latency: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-} tenantId=%X{tenantId:-}] - %msg%n"
  level:
    com.relayhub: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN

