name: RelayHub CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Verify and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Unit and Live Integration Tests
        run: ./mvnw clean test --batch-mode

      - name: Package Executable JAR
        run: ./mvnw package -DskipTests --batch-mode

      - name: Verify Docker Container Build
        run: docker build -t relayhub:ci .


      - name: Preserve Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
