name: RelayHub verification

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: relayhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Verify and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Unit and Live Integration Tests
        run: ./mvnw clean verify --batch-mode

      - name: Verify credential bootstrap safety
        run: python3 scripts/test_bootstrap_credentials.py

      - name: Verify Docker Container Build
        run: docker build -t relayhub:ci .


      - name: Verify Packaged Restart and Backup Recovery
        run: python3 scripts/verify-packaged-recovery.py --image relayhub:ci --output target/ci-packaged-recovery.json

      - name: Preserve Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/ci-packaged-recovery.json
