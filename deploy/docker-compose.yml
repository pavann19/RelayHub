services:
  postgres:
    image: postgres:16-alpine
    container_name: relayhub-postgres
    environment:
      POSTGRES_DB: relayhub
      POSTGRES_USER: relayhub
      POSTGRES_PASSWORD: relayhub_secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relayhub -d relayhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: relayhub-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    container_name: relayhub-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  relayhub:
    image: relayhub:latest
    build:
      context: ..
    container_name: relayhub-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/relayhub
      SPRING_DATASOURCE_USERNAME: relayhub
      SPRING_DATASOURCE_PASSWORD: relayhub_secret
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      RELAYHUB_BASELINE_EXISTING: ${RELAYHUB_BASELINE_EXISTING:-false}
      RELAYHUB_SEED_LOCATION: classpath:data.sql
      RELAYHUB_WEBHOOK_ALLOWED_HOSTS: mock-receiver
      RELAYHUB_WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  relayhub-2:
    image: relayhub:latest
    container_name: relayhub-app-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/relayhub
      SPRING_DATASOURCE_USERNAME: relayhub
      SPRING_DATASOURCE_PASSWORD: relayhub_secret
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      RELAYHUB_BASELINE_EXISTING: ${RELAYHUB_BASELINE_EXISTING:-false}
      RELAYHUB_SEED_LOCATION: classpath:data.sql
      RELAYHUB_WEBHOOK_ALLOWED_HOSTS: mock-receiver
      RELAYHUB_WEBHOOK_ALLOW_PRIVATE_TARGETS: "true"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-receiver:
    image: mendhak/http-https-echo:34
    container_name: relayhub-mock-receiver
    ports:
      - "127.0.0.1:9999:8080"
    environment:
      HTTP_PORT: 8080
      LOG_WITHOUT_NEWLINE: "true"

  prometheus:
    image: prom/prometheus:latest
    container_name: relayhub-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - relayhub

  grafana:
    image: grafana/grafana:11.1.0
    container_name: relayhub-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  kafka-data:

