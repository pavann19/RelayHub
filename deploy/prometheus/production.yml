global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/production-rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: relayhub
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/relayhub-observe/token
    dns_sd_configs:
      - names: ["relayhub-metrics.relayhub.svc.cluster.local"]
        type: A
        port: 8080
