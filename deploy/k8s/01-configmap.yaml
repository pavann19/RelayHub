apiVersion: v1
kind: ConfigMap
metadata:
  name: relayhub-config
  namespace: relayhub
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.relayhub.svc.cluster.local:5432/relayhub"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.relayhub.svc.cluster.local:9092"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"

  SPRING_PROFILES_ACTIVE: "production"
  RELAYHUB_WEBHOOK_ALLOWED_HOSTS: "webhook.example.com"
  RELAYHUB_RETENTION_ENABLED: "false"
