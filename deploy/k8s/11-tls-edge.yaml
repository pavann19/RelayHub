apiVersion: v1
kind: ConfigMap
metadata:
  name: relayhub-edge
  namespace: relayhub
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      client_header_timeout 10s;
      client_body_timeout 10s;
      keepalive_timeout 30s;
      send_timeout 40s;
      client_max_body_size 1m;
      server_tokens off;
      server {
        listen 8443 ssl;
        server_name relayhub.example.com;
        ssl_certificate /tls/tls.crt;
        ssl_certificate_key /tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://relayhub:80;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_connect_timeout 5s;
          proxy_read_timeout 40s;
          proxy_send_timeout 40s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relayhub-edge
  namespace: relayhub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: relayhub-edge
  template:
    metadata:
      labels:
        app: relayhub-edge
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: edge
          image: relayhub-edge:release-candidate
          command: [nginx, -g, "daemon off;", -c, /config/nginx.conf]
          ports:
            - {name: https, containerPort: 8443}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          readinessProbe:
            tcpSocket: {port: 8443}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: relayhub-edge}
        - name: tls
          secret: {secretName: relayhub-edge-tls}
        - name: temp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: relayhub-edge
  namespace: relayhub
spec:
  selector:
    app: relayhub-edge
  ports:
    - {name: https, port: 443, targetPort: 8443}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: relayhub-edge
  namespace: relayhub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: relayhub-edge
