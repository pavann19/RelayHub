apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: relayhub-hpa
  namespace: relayhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: relayhub
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

